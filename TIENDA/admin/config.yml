backend:
  name: git-gateway
  branch: main

media_folder: ""
public_folder: "/"

locale: "es"

collections:
  - name: "productos"
    label: "Catálogo de Jerseys"
    files:
      - name: "catalogo"
        label: "Todos los productos"
        file: "../productos.json"
        fields:
          - label: "Jerseys"
            name: "jerseys"
            widget: "list"
            label_singular: "Jersey"
            summary: "{{nombre}} — {{categoria}}"
            fields:
              - { label: "Nombre", name: "nombre", widget: "string", hint: "Ej: Real Madrid 26/27 local" }
              - { label: "Precio", name: "precio", widget: "string", hint: "Ej: $450 (incluye el símbolo $)" }
              - { label: "Foto", name: "img", widget: "image", hint: "Sube la foto del jersey" }
              - label: "Categoría"
                name: "categoria"
                widget: "select"
                options:
                  - { label: "Fútbol", value: "futbol" }
                  - { label: "F1", value: "f1" }
                  - { label: "NBA", value: "nba" }
              - label: "Tipo"
                name: "tipo"
                widget: "select"
                condition: "fields.categoria == 'futbol'"
                hint: "Solo para Fútbol: Define si es Actual o Retro"
                options:
                  - { label: "Actual", value: "actual" }
                  - { label: "Retro", value: "retro" }
