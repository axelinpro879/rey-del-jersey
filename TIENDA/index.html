<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rey del Jersey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --paper: #F7F5F0;
        --white: #FFFFFF;
        --ink: #12141B;
        --navy: #101B3D;
        --line: #E2DFD6;
        --muted: #8B887E;
        --crimson: #D7263D;
        --pitch: #1F6B45;
        --navy-tint: rgba(16,27,61,0.07);
        --font-display: 'Bebas Neue', sans-serif;
        --font-body: 'Manrope', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

    /* ---------- HEADER ---------- */

    header {
        text-align: center;
        padding: 64px 20px 36px;
    }

    .logo {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        margin-bottom: 22px;
    }

    .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
    }

    h1 {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: clamp(2.8rem, 8vw, 5rem);
        letter-spacing: 0.02em;
        line-height: 0.92;
        color: var(--ink);
    }

    h1 .acento { color: var(--navy); }

    .handle {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 10px;
    }

    /* Linea de medio campo: firma visual futbolera, contenida */
    .kickoff-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        max-width: 340px;
        margin: 30px auto 0;
    }

    .kickoff-line .bar {
        flex: 1;
        height: 1px;
        background: var(--line);
    }

    .kickoff-line .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--navy);
    }

    .sale-tag {
        display: inline-block;
        margin-top: 26px;
        padding: 7px 20px;
        border: 1px solid var(--crimson);
        border-radius: 999px;
        color: var(--crimson);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 600;
    }

    /* ---------- FILTROS ---------- */

    .filtros {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 40px 0 44px;
    }

    .filtro {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 600;
        padding: 11px 24px;
        border: 1.5px solid var(--ink);
        border-radius: 999px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
    }

    .filtro:hover { background: var(--navy-tint); border-color: var(--navy); color: var(--navy); }

    .filtro.active {
        background: var(--navy);
        border-color: var(--navy);
        color: var(--paper);
    }

    /* ---------- SUBFILTROS (Futbol: Actuales / Retro) ---------- */

    .filtros-sub {
        margin: -22px 0 44px;
    }

    .filtro.sub {
        padding: 8px 18px;
        font-size: 0.68rem;
        border-color: var(--muted);
        color: var(--muted);
    }

    .filtro.sub:hover { border-color: var(--navy); color: var(--navy); }

    .filtro.sub.active {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
    }

    /* ---------- BUSCADOR ---------- */

    .buscador-wrap {
        display: flex;
        justify-content: center;
        margin: 0 0 28px;
    }

    .buscador {
        width: 100%;
        max-width: 420px;
        padding: 12px 18px;
        border: 1.5px solid var(--ink);
        border-radius: 999px;
        background: var(--white);
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--ink);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .buscador::placeholder { color: var(--muted); }

    .buscador:focus {
        border-color: var(--navy);
        box-shadow: 0 0 0 3px var(--navy-tint);
    }

    .sin-resultados {
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.82rem;
        color: var(--muted);
        padding: 40px 0 60px;
    }

    /* ---------- GRID DE PRODUCTOS ---------- */

    .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 26px;
        padding-bottom: 80px;
    }

    .item {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 3px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        opacity: 0;
        animation: riseIn 0.5s ease forwards;
    }

    .item:hover {
        transform: translateY(-5px);
        box-shadow: 0 14px 30px rgba(16,27,61,0.14);
        border-color: var(--navy);
    }

    @keyframes riseIn {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .item-img-wrap {
        position: relative;
        aspect-ratio: 3 / 4;
        overflow: hidden;
        background: var(--paper);
    }

    .item-img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
    }

    .item:hover .item-img-wrap img { transform: scale(1.045); }

    .squad-tag {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(16,27,61,0.88);
        color: var(--paper);
        font-family: var(--font-mono);
        font-size: 0.65rem;
        letter-spacing: 0.06em;
        padding: 3px 8px;
        border-radius: 2px;
    }

    .item-info { padding: 16px 15px 20px; }

    .nombre {
        font-family: var(--font-display);
        font-size: 1.15rem;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        line-height: 1.1;
        color: var(--ink);
        margin-bottom: 12px;
        min-height: 2.2em;
    }

    .precio-wrap {
        display: flex;
        align-items: baseline;
        gap: 10px;
    }

    .precio-anterior {
        font-family: var(--font-mono);
        font-size: 0.82rem;
        color: var(--crimson);
        text-decoration: line-through;
        text-decoration-thickness: 1.5px;
        opacity: 0.85;
    }

    .precio {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 1.15rem;
        color: var(--navy);
    }

    /* ---------- MODAL ---------- */

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(11,13,20,0.94);
        backdrop-filter: blur(3px);
        z-index: 1000;
    }

    .modal.active {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal-content {
        position: relative;
        max-width: 90%;
        max-height: 68vh;
        overflow: hidden;
        touch-action: none;
    }

    .modal-content img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: zoom-in;
        transform-origin: center center;
        user-select: none;
        -webkit-user-drag: none;
    }

    .modal-content img.zoomed { cursor: grab; }
    .modal-content img.dragging { cursor: grabbing; }

    .zoom-controls {
        position: absolute;
        bottom: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        z-index: 10;
    }

    .zoom-controls button {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.45);
        background: rgba(11,13,20,0.35);
        color: var(--paper);
        font-family: var(--font-mono);
        font-size: 1.1em;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
    }

    .zoom-controls button:hover {
        background: rgba(255,255,255,0.16);
        border-color: #fff;
    }

    .close-btn {
        position: absolute;
        top: 22px;
        right: 26px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.4);
        background: transparent;
        font-size: 22px;
        font-family: var(--font-mono);
        color: var(--paper);
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
    }

    .close-btn:hover {
        border-color: #fff;
        background: rgba(255,255,255,0.1);
    }

    .modal-info {
        color: var(--paper);
        text-align: center;
        margin-top: 26px;
    }

    .modal-info .nombre {
        color: var(--paper);
        font-size: 1.7rem;
        min-height: 0;
        margin-bottom: 12px;
    }

    .modal-info .precio-wrap { justify-content: center; }

    .modal-info .precio { font-size: 1.6rem; color: var(--paper); }

    .modal-info .precio-anterior { font-size: 1rem; }

    .zoom-hint {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(247,245,240,0.5);
        margin-top: 16px;
    }

    /* ---------- FOOTER ---------- */

    footer {
        text-align: center;
        padding: 30px 20px 50px;
        border-top: 1px solid var(--line);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 980px) {
        .grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 640px) {
        header { padding: 48px 16px 28px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .nombre { font-size: 1rem; }
        .precio { font-size: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
    }
</style>
</head>
<body>
    <div class="container">
        <header>
            <img src="logo.png" alt="Rey del Jersey" class="logo">
            <div class="eyebrow">México · Jerseys oficiales y retro</div>
            <h1>Rey <span class="acento">del</span> Jersey</h1>
            <div class="handle">@reydeljersey_</div>
            <div class="kickoff-line">
                <span class="bar"></span>
                <span class="dot"></span>
                <span class="bar"></span>
            </div>
            <div class="sale-tag">Temporada de rebajas</div>
        </header>

        <div class="buscador-wrap">
            <input type="text" id="buscador" class="buscador" placeholder="Buscar por equipo, selección, jugador o año...">
        </div>

        <div class="filtros">
            <button class="filtro active" data-categoria="todos">Todos</button>
            <button class="filtro" data-categoria="futbol">Fútbol</button>
            <button class="filtro" data-categoria="f1">F1</button>
            <button class="filtro" data-categoria="nba">NBA</button>
        </div>

        <div class="filtros filtros-sub" id="subFiltrosFutbol">
            <button class="filtro sub active" data-sub="todos">Todos</button>
            <button class="filtro sub" data-sub="actual">Actuales</button>
            <button class="filtro sub" data-sub="retro">Retro</button>
        </div>

        <div class="grid" id="grid"></div>
        <p class="sin-resultados" id="sinResultados" style="display:none;">No encontramos jerseys con ese criterio.</p>
    </div>

    <!-- Modal para ver imagen grande -->
    <div class="modal" id="modal">
        <button class="close-btn" onclick="cerrarModal()">&times;</button>
        <div class="modal-content" id="modalContent">
            <img id="modalImg" src="" alt="">
            <div class="zoom-controls">
                <button onclick="botonZoom(1)" title="Acercar">+</button>
                <button onclick="botonZoom(-1)" title="Alejar">&minus;</button>
            </div>
        </div>
        <div class="modal-info">
            <div class="nombre" id="modalNombre"></div>
            <div class="precio-wrap">
                <span class="precio-anterior" id="modalPrecioAnterior"></span>
                <span class="precio" id="modalPrecio"></span>
            </div>
            <div class="zoom-hint">Rueda o pellizca para zoom · doble clic para restablecer</div>
        </div>
    </div>

    <footer>Rey del Jersey · Hecho para quienes viven el fútbol</footer>

    <script>
        // Precio anterior (antes de rebaja) segun el tipo de jersey
        const precioAnterior = {
            actual: "$550",
            retro: "$650"
        };

        let jerseys = [];

        function cargarProductos() {
            fetch("productos.json")
                .then(res => res.json())
                .then(data => {
                    jerseys = data.jerseys || [];
                    mostrarProductos();
                })
                .catch(err => {
                    console.error("No se pudo cargar productos.json:", err);
                    document.getElementById("grid").innerHTML = '<p style="grid-column:1/-1; text-align:center; font-family:var(--font-mono); color:var(--muted);">No se pudieron cargar los productos.</p>';
                });
        }

        let categoriaActiva = "todos";
        let subFiltroFutbol = "todos";
        let terminoBusqueda = "";

        function normalizar(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function pasaFiltros(j) {
            if (categoriaActiva !== "todos" && j.categoria !== categoriaActiva) return false;
            if (categoriaActiva === "futbol" && subFiltroFutbol !== "todos" && j.tipo !== subFiltroFutbol) return false;
            if (terminoBusqueda && !normalizar(j.nombre).includes(normalizar(terminoBusqueda))) return false;
            return true;
        }

        function abrirModal(jersey) {
            document.getElementById("modal").classList.add("active");
            document.getElementById("modalImg").src = jersey.img;
            document.getElementById("modalNombre").textContent = jersey.nombre;
            document.getElementById("modalPrecio").textContent = jersey.precio;
            document.getElementById("modalPrecioAnterior").textContent = precioAnterior[jersey.tipo] || "";
            resetZoom();
        }

        function cerrarModal() {
            document.getElementById("modal").classList.remove("active");
            resetZoom();
        }

        function mostrarProductos() {
            let html = "";
            let numero = 0;
            let coincidencias = 0;
            jerseys.forEach(j => {
                numero++;
                if (pasaFiltros(j)) {
                    coincidencias++;
                    const anterior = precioAnterior[j.tipo] || "";
                    const tag = "Nº " + String(numero).padStart(2, "0");
                    const delay = Math.min(numero * 0.025, 0.5);
                    html += '<div class="item" style="animation-delay:' + delay + 's" onclick="abrirModal({img: \'' + j.img + '\', nombre: \'' + j.nombre + '\', precio: \'' + j.precio + '\', tipo: \'' + j.tipo + '\'})">';
                    html += '<div class="item-img-wrap">';
                    html += '<img src="' + j.img + '" alt="' + j.nombre + '">';
                    html += '<span class="squad-tag">' + tag + '</span>';
                    html += '</div>';
                    html += '<div class="item-info">';
                    html += '<div class="nombre">' + j.nombre + '</div>';
                    html += '<div class="precio-wrap">';
                    html += '<span class="precio-anterior">' + anterior + '</span>';
                    html += '<span class="precio">' + j.precio + '</span>';
                    html += '</div>';
                    html += '</div>';
                    html += '</div>';
                }
            });
            document.getElementById("grid").innerHTML = html;
            document.getElementById("sinResultados").style.display = coincidencias === 0 ? "block" : "none";
        }

        // Filtro de categoria (Todos / Futbol / F1 / NBA)
        document.querySelectorAll('.filtros:not(.filtros-sub) .filtro').forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll('.filtros:not(.filtros-sub) .filtro').forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                categoriaActiva = this.dataset.categoria;

                // El subfiltro Actuales/Retro solo aplica y se muestra dentro de Futbol
                const subFiltros = document.getElementById("subFiltrosFutbol");
                if (categoriaActiva === "futbol") {
                    subFiltros.style.display = "flex";
                } else {
                    subFiltros.style.display = "none";
                    subFiltroFutbol = "todos";
                    document.querySelectorAll(".filtro.sub").forEach(b => b.classList.remove("active"));
                    document.querySelector('.filtro.sub[data-sub="todos"]').classList.add("active");
                }
                mostrarProductos();
            });
        });

        // Subfiltro de Futbol (Todos / Actuales / Retro)
        document.querySelectorAll(".filtro.sub").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll(".filtro.sub").forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                subFiltroFutbol = this.dataset.sub;
                mostrarProductos();
            });
        });

        // Buscador en tiempo real
        document.getElementById("buscador").addEventListener("input", function() {
            terminoBusqueda = this.value;
            mostrarProductos();
        });

        // El subfiltro empieza oculto porque "Todos" (categoria) esta activo por defecto
        document.getElementById("subFiltrosFutbol").style.display = "none";

        // Cerrar modal al hacer clic fuera
        document.getElementById("modal").addEventListener("click", function(e) {
            if (e.target === this) {
                cerrarModal();
            }
        });

        // ---- Estado del zoom ----
        let scale = 1, panX = 0, panY = 0;
        let isDragging = false, startX = 0, startY = 0;
        let touchStartDist = 0, touchStartScale = 1;
        let touchStartPanX = 0, touchStartPanY = 0, touchStartMidX = 0, touchStartMidY = 0;
        const MIN_SCALE = 1, MAX_SCALE = 4;

        const modalImg = document.getElementById("modalImg");
        const modalContent = document.getElementById("modalContent");

        function actualizarTransform() {
            modalImg.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
            modalImg.classList.toggle('zoomed', scale > 1);
        }

        function resetZoom() {
            scale = 1; panX = 0; panY = 0;
            actualizarTransform();
        }

        function limitarPan() {
            const rect = modalContent.getBoundingClientRect();
            const maxOffsetX = Math.max(0, (rect.width * (scale - 1)) / 2);
            const maxOffsetY = Math.max(0, (rect.height * (scale - 1)) / 2);
            panX = Math.max(-maxOffsetX, Math.min(maxOffsetX, panX));
            panY = Math.max(-maxOffsetY, Math.min(maxOffsetY, panY));
        }

        function zoomHaciaPunto(nuevaEscala, puntoX, puntoY) {
            nuevaEscala = Math.min(MAX_SCALE, Math.max(MIN_SCALE, nuevaEscala));
            const rect = modalContent.getBoundingClientRect();
            const cx = puntoX - rect.left - rect.width / 2;
            const cy = puntoY - rect.top - rect.height / 2;
            const factor = nuevaEscala / scale;
            panX = cx - (cx - panX) * factor;
            panY = cy - (cy - panY) * factor;
            scale = nuevaEscala;
            if (scale === 1) { panX = 0; panY = 0; }
            limitarPan();
            actualizarTransform();
        }

        function botonZoom(direccion) {
            const rect = modalContent.getBoundingClientRect();
            zoomHaciaPunto(scale + direccion * 0.6, rect.left + rect.width / 2, rect.top + rect.height / 2);
        }

        modalContent.addEventListener('wheel', function(e) {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.3 : -0.3;
            zoomHaciaPunto(scale + delta, e.clientX, e.clientY);
        }, { passive: false });

        modalImg.addEventListener('dblclick', resetZoom);

        modalImg.addEventListener('click', function(e) {
            if (scale === 1) {
                zoomHaciaPunto(2.2, e.clientX, e.clientY);
            }
        });

        modalImg.addEventListener('mousedown', function(e) {
            if (scale === 1) return;
            isDragging = true;
            modalImg.classList.add('dragging');
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });
        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            limitarPan();
            actualizarTransform();
        });
        window.addEventListener('mouseup', function() {
            isDragging = false;
            modalImg.classList.remove('dragging');
        });

        function distanciaEntreToques(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function puntoMedio(touches) {
            return {
                x: (touches[0].clientX + touches[1].clientX) / 2,
                y: (touches[0].clientY + touches[1].clientY) / 2
            };
        }

        modalContent.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                touchStartDist = distanciaEntreToques(e.touches);
                touchStartScale = scale;
                touchStartPanX = panX;
                touchStartPanY = panY;
                const mid = puntoMedio(e.touches);
                touchStartMidX = mid.x;
                touchStartMidY = mid.y;
            } else if (e.touches.length === 1 && scale > 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        }, { passive: true });

        modalContent.addEventListener('touchmove', function(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                const nuevaDist = distanciaEntreToques(e.touches);
                const nuevaEscala = Math.min(MAX_SCALE, Math.max(MIN_SCALE, touchStartScale * (nuevaDist / touchStartDist)));
                const rect = modalContent.getBoundingClientRect();
                const cx = touchStartMidX - rect.left - rect.width / 2;
                const cy = touchStartMidY - rect.top - rect.height / 2;
                const factor = nuevaEscala / touchStartScale;
                const mid = puntoMedio(e.touches);
                panX = cx - (cx - touchStartPanX) * factor + (mid.x - touchStartMidX);
                panY = cy - (cy - touchStartPanY) * factor + (mid.y - touchStartMidY);
                scale = nuevaEscala;
                if (scale === 1) { panX = 0; panY = 0; }
                limitarPan();
                actualizarTransform();
            } else if (e.touches.length === 1 && isDragging) {
                e.preventDefault();
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                limitarPan();
                actualizarTransform();
            }
        }, { passive: false });

        modalContent.addEventListener('touchend', function() {
            isDragging = false;
        });

        cargarProductos();
    </script>
</body>
</html>
